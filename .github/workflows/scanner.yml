name: Kursrutsch-Scanner

on:
  schedule:
    # Ziel: Scan startet 19:15 Uhr, Push kommt um 19:30 Uhr (deutsche Zeit), sobald die
    # neue Seite online ist. GitHub startet geplante Läufe oft 5–30 Min. zu spät, deshalb
    # wird früher angestoßen und das Skript wartet. Spätere Zeiten = Reserve. Gescannt wird
    # nur EINMAL pro Tag, Mo–Fr, nicht an bundesweiten Feiertagen. (Zeiten in UTC)
    - cron: "40 16 * * 1-5"   # Sommerzeit 18:40 · Winterzeit 17:40 (zu früh, übersprungen)
    - cron: "55 16 * * 1-5"   # Sommerzeit 18:55
    - cron: "40 17 * * 1-5"   # Winterzeit 18:40 · Sommerzeit Reserve
    - cron: "55 17 * * 1-5"   # Winterzeit 18:55
    - cron: "25 18 * * 1-5"   # Reserve
    - cron: "55 18 * * 1-5"   # Reserve
  workflow_dispatch:        # manueller Start über "Run workflow"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCANNER_CACHE: cache
          PUSH_FILE: ${{ runner.temp }}/push.json
        run: |
          EXTRA="--einmal-taeglich-ab 19:15"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA=""; fi
          set -o pipefail
          python -u aktien_crash_scanner.py --html docs/index.html --state docs/state.json $EXTRA 2>&1 | tee docs/letzter_lauf.log

      - name: Fehler melden
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Kursrutsch-Scanner: Lauf fehlgeschlagen" -H "Tags: warning" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Der heutige Lauf ist mit einem Fehler abgebrochen. Tippen für Details." "https://ntfy.sh/$NTFY_TOPIC"

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || (git commit -m "Scan $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && (git push || (git pull --rebase -X theirs && git push)))

      - name: Push senden, sobald die Seite online ist
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          NICHT_VOR="19:30"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then NICHT_VOR=""; fi
          python -u push_nach_veroeffentlichung.py "${{ runner.temp }}/push.json" docs/index.html $NICHT_VOR
