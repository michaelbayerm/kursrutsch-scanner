name: Kursrutsch-Scanner

on:
  schedule:
    # GitHub startet geplante Läufe oft 5–30 Min. zu spät. Deshalb wird schon gegen
    # 16:30 Uhr gestartet; das Skript wartet dann bis genau 17:00 Uhr deutscher Zeit.
    # Spätere Zeiten sind Reserve, falls GitHub einen Start auslässt. Gescannt wird nur
    # EINMAL pro Tag, Mo–Fr, nicht an bundesweiten Feiertagen. (Zeiten in UTC)
    - cron: "27 14 * * 1-5"   # Sommerzeit 16:27 · Winterzeit 15:27 (zu früh, übersprungen)
    - cron: "42 14 * * 1-5"   # Sommerzeit 16:42
    - cron: "27 15 * * 1-5"   # Winterzeit 16:27 · Sommerzeit Reserve 17:27
    - cron: "42 15 * * 1-5"   # Winterzeit 16:42
    - cron: "17 16 * * 1-5"   # Reserve
    - cron: "7 17 * * 1-5"    # Reserve
  workflow_dispatch:        # manueller Start über "Run workflow"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCANNER_CACHE: cache
        run: |
          EXTRA="--einmal-taeglich-ab 17"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA=""; fi
          set -o pipefail
          python -u aktien_crash_scanner.py --html docs/index.html --state docs/state.json $EXTRA 2>&1 | tee docs/letzter_lauf.log

      - name: Fehler melden
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Kursrutsch-Scanner: Lauf fehlgeschlagen" -H "Tags: warning" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Der heutige Lauf ist mit einem Fehler abgebrochen. Tippen für Details." "https://ntfy.sh/$NTFY_TOPIC"

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || (git commit -m "Scan $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && (git push || (git pull --rebase -X theirs && git push)))
