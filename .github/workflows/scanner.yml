name: Kursrutsch-Scanner

on:
  schedule:
    # GitHub rechnet in UTC und startet geplante Läufe oft verspätet oder gar nicht,
    # besonders zur vollen Stunde. Deshalb mehrere Startzeiten ab 17 Uhr deutscher Zeit
    # (Sommer- und Winterzeit), nur Mo–Fr. Das Skript scannt trotzdem nur EINMAL pro Tag
    # und pausiert zusätzlich an bundesweiten Feiertagen.
    - cron: "7 15 * * 1-5"    # 17:07 MESZ
    - cron: "37 15 * * 1-5"   # 17:37 MESZ
    - cron: "7 16 * * 1-5"    # 17:07 MEZ / 18:07 MESZ
    - cron: "37 16 * * 1-5"   # 17:37 MEZ
    - cron: "7 17 * * 1-5"    # Reserve
    - cron: "7 18 * * 1-5"    # Reserve
  workflow_dispatch:        # manueller Start über "Run workflow"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCANNER_CACHE: cache
        run: |
          EXTRA="--einmal-taeglich-ab 17"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA=""; fi
          set -o pipefail
          python -u aktien_crash_scanner.py --html docs/index.html --state docs/state.json $EXTRA 2>&1 | tee docs/letzter_lauf.log

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || (git commit -m "Scan $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && (git push || (git pull --rebase -X theirs && git push)))
