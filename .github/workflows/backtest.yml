name: Backtest-Daten

# Läuft nur im Branch "backtest" (der tägliche Scanner auf main bleibt unberührt).
on:
  push:
    branches: [backtest]
    paths: ["backtest/daten_export.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Daten exportieren
        run: |
          mkdir -p backtest/daten
          set -o pipefail
          python -u backtest/daten_export.py 2>&1 | tee backtest/daten/lauf.log

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/daten
          git diff --cached --quiet || (git commit -m "Backtest-Daten $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && git push)
