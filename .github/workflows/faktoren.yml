name: Faktor-ETF-Daten

# Läuft nur im Branch "backtest".
on:
  push:
    branches: [backtest]
    paths: ["backtest/faktor_export.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten laden
        run: python -u backtest/faktor_export.py
      - name: Ergebnis speichern
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/daten
          git diff --cached --quiet || (git commit -m "Faktor-ETF-Daten $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" && (git push || (git pull --rebase && git push)))
